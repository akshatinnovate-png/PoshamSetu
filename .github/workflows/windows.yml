name: windows-build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PoshanSetu-win32-x64/* -DestinationPath PoshanSetu-win32-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PoshanSetu-win32-x64
          path: PoshanSetu-win32-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PoshanSetu-win32-x64.zip
